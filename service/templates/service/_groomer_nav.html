<nav class="navbar-custom">
    <a class="brand-group" href="{% url 'service:groomer_dashboard' %}">
        <span class="brand-logo"><i class="bi bi-scissors"></i></span>
        <span class="brand-name">Groomer</span>
    </a>
    <div class="nav-right">
        <button type="button"
                class="theme-toggle"
                data-theme-toggle
                aria-label="Beralih ke mode gelap"
                aria-pressed="false">
            <i class="bi bi-moon-stars-fill"></i>
        </button>
        <div class="user-pill d-none d-sm-flex">
            <i class="bi bi-person-circle fs-5 text-secondary"></i>
            {{ request.user.get_full_name|default:request.user.username }}
        </div>
        <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-right me-1 d-none d-sm-inline"></i> Keluar</button>
        </form>
    </div>
</nav>
