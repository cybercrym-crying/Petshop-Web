{% comment %}Navbar publik. Pakai: {% include "customer/_site_nav.html" with active="home" %}{% endcomment %}
<nav class="navbar-seelly sx-nav">
    <div class="container d-flex align-items-center justify-content-between gap-2">
        <a href="{% url 'customer:home' %}"
           class="navbar-brand text-decoration-none">🐾 Seelly Petshop</a>
        <div class="d-none d-xl-flex align-items-center">
            <a href="{% url 'customer:home' %}"
               class="nav-link-custom{% if active == 'home' %} active{% endif %}">Beranda</a>
            <a href="{% url 'customer:shop' %}"
               class="nav-link-custom{% if active == 'shop' %} active{% endif %}">Belanja</a>
            <a href="{% url 'customer:about' %}"
               class="nav-link-custom{% if active == 'about' %} active{% endif %}">Tentang Kami</a>
            <a href="#kontak" class="nav-link-custom">Hubungi Kami</a>
        </div>
        <div class="d-flex align-items-center">
            <form id="site-search"
                  class="sx-search d-none d-xl-flex js-search-form"
                  action="{% url 'customer:shop' %}"
                  method="get"
                  role="search">
                <input type="search"
                       name="q"
                       id="product-search"
                       class="search-bar js-search"
                       placeholder="Cari produk..."
                       aria-label="Cari produk">
                <button class="icon-btn" type="submit" aria-label="Cari" id="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </form>
            <button class="icon-btn" type="button" aria-label="Favorit">
                <i class="far fa-heart"></i>
                <span class="badge-count">0</span>
            </button>
            <a class="icon-btn"
               href="{% url 'customer:cart' %}"
               aria-label="Keranjang">
                <i class="fas fa-shopping-cart"></i>
                <span class="badge-count" id="cart-count">0</span>
            </a>
            <button class="icon-btn d-xl-none"
                    type="button"
                    id="nav-toggle"
                    aria-label="Buka menu"
                    aria-expanded="false"
                    aria-controls="mobile-menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>
    <div id="mobile-menu" class="sx-mobile-menu d-xl-none">
        <div class="container">
            <form class="sx-search-m js-search-form"
                  action="{% url 'customer:shop' %}"
                  method="get"
                  role="search">
                <input type="search"
                       name="q"
                       class="js-search"
                       placeholder="Cari produk..."
                       aria-label="Cari produk">
                <button class="icon-btn" type="submit" aria-label="Cari">
                    <i class="fas fa-search"></i>
                </button>
            </form>
            <a href="{% url 'customer:home' %}"
               class="sx-mlink{% if active == 'home' %} active{% endif %}">Beranda</a>
            <a href="{% url 'customer:shop' %}"
               class="sx-mlink{% if active == 'shop' %} active{% endif %}">Belanja</a>
            <a href="{% url 'customer:about' %}"
               class="sx-mlink{% if active == 'about' %} active{% endif %}">Tentang Kami</a>
            <a href="#kontak" class="sx-mlink">Hubungi Kami</a>
        </div>
    </div>
</nav>
