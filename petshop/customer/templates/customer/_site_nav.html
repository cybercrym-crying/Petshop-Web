<header class="sn-header">
    <nav class="container sn-bar" aria-label="Navigasi utama">
        <a href="{% url 'customer:home' %}" class="sn-brand">
            <i class="fas fa-paw" aria-hidden="true"></i>
            <span>Seelly Petshop</span>
        </a>
        <button class="sn-toggle"
                type="button"
                id="nav-toggle"
                aria-label="Buka menu"
                aria-expanded="false"
                aria-controls="nav-links">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
        <div class="sn-links" id="nav-links">
            <a href="{% url 'customer:home' %}"
               class="sn-link{% if active == 'home' %} active{% endif %}">Beranda</a>
            <a href="{% url 'customer:shop' %}"
               class="sn-link{% if active == 'shop' %} active{% endif %}">Belanja</a>
            <a href="{% url 'customer:about' %}"
               class="sn-link{% if active == 'about' %} active{% endif %}">Tentang Kami</a>
            <a href="#kontak" class="sn-link">Hubungi Kami</a>
        </div>
        <div class="sn-actions">
            <form class="sn-search"
                  action="{% url 'customer:shop' %}"
                  method="get"
                  role="search">
                <input type="search"
                       name="q"
                       value="{{ query|default:'' }}"
                       placeholder="Cari produk..."
                       aria-label="Cari produk">
                <button type="submit" aria-label="Cari">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </button>
            </form>
            <a class="sn-icon{% if active == 'wishlist' %} is-active{% endif %}"
               href="{% url 'customer:wishlist' %}"
               aria-label="Favorit">
                <i class="far fa-heart" aria-hidden="true"></i>
                <span class="sn-badge" id="wishlist-count" hidden>0</span>
            </a>
            <a class="sn-icon"
               href="{% url 'customer:cart' %}"
               aria-label="Keranjang">
                <i class="fas fa-shopping-cart" aria-hidden="true"></i>
                <span class="sn-badge" id="cart-count" hidden>0</span>
            </a>
        </div>
    </nav>
</header>
