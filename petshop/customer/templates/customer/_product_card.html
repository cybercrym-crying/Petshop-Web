{% load static rupiah customer_extras %}
<article class="product-card" data-product-id="{{ item.id }}">
    <div class="product-photo">
        <a href="{% url 'customer:product_detail' item.id %}"
           tabindex="-1"
           aria-hidden="true">
            {% if item.photo %}
                <img src="{{ item.photo.url }}" alt="" loading="lazy">
            {% else %}
                <img src="{% static 'customer/img/product-placeholder.svg' %}"
                     alt=""
                     loading="lazy">
            {% endif %}
        </a>
        <span class="chip chip-category">{{ item.category.name|kategori }}</span>
        {% if item.stock == 0 %}
            <span class="chip chip-stock chip-out">Stok habis</span>
        {% elif item.stock <= 5 %}
            <span class="chip chip-stock">Sisa {{ item.stock }}</span>
        {% endif %}
        <button type="button"
                class="wishlist-btn"
                data-wishlist-toggle
                data-id="{{ item.id }}"
                data-name="{{ item.name }}"
                aria-pressed="false"
                aria-label="Tambah {{ item.name }} ke favorit">
            <i class="far fa-heart" aria-hidden="true"></i>
        </button>
    </div>
    <div class="product-info">
        <h3 class="product-name">
            <a href="{% url 'customer:product_detail' item.id %}">{{ item.name }}</a>
        </h3>
        <div class="product-price">Rp {{ item.selling_price|default:"0"|rupiah }}</div>
        <button type="button"
                class="btn-add-cart"
                data-add-to-cart
                data-id="{{ item.id }}"
                data-name="{{ item.name }}"
                data-price="{{ item.selling_price }}"
                data-stock="{{ item.stock }}"
                data-url="{% url 'customer:product_detail' item.id %}"
                data-photo="{% if item.photo %}{{ item.photo.url }}{% endif %}"
                {% if item.stock == 0 %}disabled{% endif %}>
            <i class="fas fa-cart-plus" aria-hidden="true"></i>
            {% if item.stock == 0 %}
                Stok habis
            {% else %}
                Tambah ke Keranjang
            {% endif %}
        </button>
    </div>
</article>
