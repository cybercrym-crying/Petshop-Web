{% load static %}
<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Seelly Petshop - Keranjang Belanja</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="{% static 'customer/css/cart.css' %}">
    </head>
    <body>
        <!-- Header -->
        <div class="cart-header">
            <div class="container d-flex align-items-center justify-content-between">
                <a href="{% url 'customer:home' %}" class="logo text-decoration-none">
                    <i class="fas fa-paw"></i> Seelly Petshop
                </a>
                <div class="d-flex align-items-center">
                    <button class="btn btn-link text-decoration-none"
                            onclick="window.location.href='{% url 'customer:shop' %}'">
                        <i class="fas fa-shopping-cart fa-lg"
                           style="color: var(--primary-purple)"></i>
                        <span class="badge-count"
                              id="cart-count"
                              style="background: var(--primary-purple);
                                     color: white;
                                     border-radius: 50%;
                                     padding: 2px 8px;
                                     font-size: 0.8rem;
                                     margin-left: 5px">0</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="cart-container">
            <h1 class="cart-title">
                <i class="fas fa-shopping-cart"></i> Keranjang Saya
            </h1>
            <div class="row">
                <div class="col-lg-8">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>Produk</th>
                                <th>Harga</th>
                                <th>Jumlah</th>
                                <th>Subtotal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items">
                        </tbody>
                    </table>
                    <div id="empty-cart" class="empty-cart-message" style="display:none;">
                        <i class="fas fa-shopping-cart"></i>
                        <h4>Keranjang Anda Kosong</h4>
                        <p class="text-muted">Yuk, mulai belanja!</p>
                        <a href="{% url 'customer:shop' %}" class="btn-continue">Mulai Belanja</a>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="summary-card">
                        <h5 class="fw-bold mb-3">Ringkasan Pesanan</h5>
                        <div class="summary-row"><span>Subtotal</span><span id="subtotal">Rp 0</span></div>
                        <div class="summary-row"><span>Ongkos Kirim</span><span>Rp 10.000</span></div>
                        <div class="summary-row total"><span>Total</span><span id="total">Rp 10.000</span></div>
                        <button class="btn-checkout"
                                id="btn-checkout"
                                data-checkout-url="{% url 'customer:checkout' %}">Lanjut ke Checkout</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="{% static 'customer/js/cart.js' %}"></script>
    </body>
</html>
