{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seelly Petshop - Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'customer/css/checkout.css' %}">
</head>
<body>

    <!-- Header -->
    <div class="checkout-header">
        <div class="container d-flex align-items-center justify-content-between">
            <a href="{% url 'customer:home' %}" class="logo text-decoration-none">
                <i class="fas fa-paw"></i> Seelly Petshop
            </a>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-link text-decoration-none" onclick="window.location.href='{% url 'customer:cart' %}'">
                    <i class="fas fa-shopping-cart fa-lg" style="color: var(--primary-purple);"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="checkout-container">
        <h1 class="checkout-title">
            <i class="far fa-clock"></i> Checkout
        </h1>
        
        <div class="row">
            <!-- Left Column: Delivery & Payment -->
            <div class="col-lg-7">
                <!-- Delivery Information -->
                <div class="delivery-section">
                    <div class="section-title">
                        <i class="fas fa-map-marker-alt" style="color: var(--primary-purple);"></i>
                        Delivery Information
                    </div>
                    
                    <form id="checkout-form">
                        <div class="mb-3">
                            <label class="form-label">Full Name *</label>
                            <input type="text" name="nama" class="form-control" required placeholder="Enter your full name">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Phone Number *</label>
                            <input type="tel" name="no_wa" class="form-control" required placeholder="081234567890">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Address *</label>
                            <textarea name="alamat" class="form-control" rows="3" required placeholder="Enter your complete address (Street, RT/RW, Village, District, City, Postal Code)"></textarea>
                            <small class="text-muted">Example: Jl. Merdeka No. 123, RT 001/RW 002, Kel. Sukamaju, Kec. Bandung Wetan, Kota Bandung, 40115</small>
                        </div>
                    </form>
                </div>
                
                <!-- Payment Method -->
                <div class="payment-section">
                    <div class="section-title">
                        <i class="fas fa-credit-card" style="color: var(--primary-purple);"></i>
                        Payment Method
                    </div>
                    
                    <div class="payment-option">
                        <input type="radio" name="payment_method" id="cod" value="Cash on Delivery (COD)" checked>
                        <label for="cod">Cash on Delivery (COD)</label>
                    </div>
                    
                    <div class="payment-option">
                        <input type="radio" name="payment_method" id="transfer" value="Bank Transfer">
                        <label for="transfer">Bank Transfer</label>
                    </div>
                    
                    <div class="payment-option">
                        <input type="radio" name="payment_method" id="ewallet" value="E-Wallet">
                        <label for="ewallet">E-Wallet (GoPay/OVO/DANA)</label>
                    </div>
                </div>
                
                <button type="button" class="btn-place-order" onclick="placeOrder(event)">
                    <i class="fab fa-whatsapp"></i> Place Order via WhatsApp
                </button>
            </div>
            
            <!-- Right Column: Order Summary -->
            <div class="col-lg-5">
                <div class="summary-section">
                    <div class="section-title">
                        <i class="fas fa-shopping-cart" style="color: var(--primary-purple);"></i>
                        Order Summary
                    </div>
                    
                    <div id="order-items">
                    </div>
                    
                    <div id="empty-cart" class="empty-cart-message" style="display: none;">
                        <i class="fas fa-shopping-cart"></i>
                        <p class="text-muted">Your cart is empty</p>
                        <a href="{% url 'customer:katalog' %}" class="btn btn-primary mt-3" style="background: var(--primary-purple); border: none;">Start Shopping</a>
                    </div>
                    
                    <div class="total-section">
                        <div class="total-row">
                            <span>Total</span>
                            <span id="total-price">Rp 0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'customer/js/checkout.js' %}"></script>
</body>
</html>
