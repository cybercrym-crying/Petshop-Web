{% load i18n static %}
{# Tombol ganti bahasa ID/EN. Pilihan disimpan di cookie oleh view set_language bawaan Django. #}
<link rel="stylesheet" href="{% static 'css/lang_toggle.css' %}?v=1">
<script src="{% static 'js/i18n.js' %}?v=4"></script>
<form class="lang-toggle{% if extra %} {{ extra }}{% endif %}" action="{% url 'set_language' %}" method="post" aria-label="{% translate 'Bahasa' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" name="language" value="id" lang="id" class="lang-toggle__btn{% if LANGUAGE_CODE != 'en' %} is-active{% endif %}" aria-pressed="{% if LANGUAGE_CODE != 'en' %}true{% else %}false{% endif %}" title="Bahasa Indonesia">ID</button>
    <button type="submit" name="language" value="en" lang="en" class="lang-toggle__btn{% if LANGUAGE_CODE == 'en' %} is-active{% endif %}" aria-pressed="{% if LANGUAGE_CODE == 'en' %}true{% else %}false{% endif %}" title="English">EN</button>
</form>
