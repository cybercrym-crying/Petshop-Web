{% load i18n %}
{# Tombol mode terang/gelap. Logika di static/js/theme_boot.js (dimuat di <head>). #}
<button type="button"
        class="theme-toggle{% if extra %} {{ extra }}{% endif %}"
        data-theme-toggle
        data-label-dark="{% translate 'Beralih ke mode gelap' %}"
        data-label-light="{% translate 'Beralih ke mode terang' %}"
        aria-pressed="false"
        aria-label="{% translate 'Beralih ke mode gelap' %}"
        title="{% translate 'Beralih ke mode gelap' %}">
    <svg class="theme-toggle__moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
    <svg class="theme-toggle__sun" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" /></svg>
</button>
