{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'id' }}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Petshop{% endblock %}</title>
    <link href="{% static 'vendor/fonts/fonts.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=ux2">
    {% block extraHead %}{% endblock %}
    <link href="{% static 'css/actions.css' %}?v=ux2" rel="stylesheet">
</head>
<body>
    {% include "partials/navbar.html" %}

    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    {% block extraScript %}{% endblock %}
    <script src="{% static 'js/layout.js' %}?v=1"></script>
</body>
</html>
