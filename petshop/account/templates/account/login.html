<!doctype html>
{% load static %}
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employee - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'account/css/login.css' %}">
  </head>
  <body>
    <div class="row g-0">
      <aside class="col-12 col-md-5 col-lg-4 side-panel">
        <div class="brand">
          <span class="brand-logo">L</span>
          <span class="brand-name">Employee</span>
        </div>
        <div>
          <h1 class="side-title">Welcome back!</h1>
          <p class="side-text">Manage accout, product and transaction</p>
        </div>
      </aside>

      <main
        class="col-12 col-md-7 col-lg-8 main-panel d-flex align-items-center justify-content-center"
      >
        <div class="form-wrap">
          <h2 class="form-title">Login</h2>
          <p class="form-sub">Log in to your account to continue</p>

          {% if error %}
          <div class="error-box" role="alert">{{ error }}</div>
          {% endif %}

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                name="username"
                class="form-control"
                id="username"
                placeholder="Masukkan username"
                autocomplete="username"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <input
                  type="password"
                  name="password"
                  class="form-control"
                  id="password"
                  placeholder="Masukkan password"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="toggle-password"
                  type="button"
                  aria-label="Tampilkan password"
                  data-toggle-password
                >
                  <svg
                    id="icon-show"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"
                    />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    id="icon-hide"
                    class="d-none"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"
                    />
                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="btn-orange">Login</button>

            <p class="foot-text">
              Don't have an account yet?
              <a href="#" class="link-purple">Contact admin</a>
            </p>
          </form>
        </div>
      </main>
    </div>

    <script src="{% static 'account/js/login.js' %}"></script>
  </body>
</html>
