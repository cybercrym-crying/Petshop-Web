{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'id' }}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}Seelly{% endblock %}</title>
        <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet" />
        <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
        <link href="{% static 'vendor/fonts/fonts.css' %}" rel="stylesheet">
        {% block extra_head %}{% endblock %}
        <link href="{% static 'css/actions.css' %}?v=ux2" rel="stylesheet">
    </head>
    <body>
        {% include "account/partials/staff_sidebar.html" %}
        <main class="staff-main">
            {% block content %}{% endblock %}
        </main>
        <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
        <script src="{% static 'js/common.js' %}?v=2"></script>
        {% block extra_script %}{% endblock %}
        <script src="{% static 'js/layout.js' %}?v=1"></script>
    </body>
</html>
