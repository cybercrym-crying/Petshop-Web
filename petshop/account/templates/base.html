{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Petshop{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { font-family: "Inter", sans-serif; background-color: #f7f1ea; }
        .navbar-custom { background: #f7f1ea; padding: 14px 40px; border-bottom: 1px solid #e5ddd0; }
        .nav-link-custom { color: #333; font-size: 0.95rem; margin: 0 12px; text-decoration: none; }
        .nav-link-custom:hover { color: #9850c5; }
        .btn-brand { background-color: #b98fce; color: #fff; border: none; font-weight: 500; }
        .btn-brand:hover { background-color: #a87dbd; color: #fff; }
    </style>
    {% block extraHead %}{% endblock %}
</head>
<body>
    {% include "partials/navbar.html" %}

    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extraScript %}{% endblock %}
</body>
</html>
