{% load static %}
<link rel="stylesheet"
      href="{% static 'css/staff/admin/staff_nav.css' %}?v=1">
<nav class="navbar-petadmin">
    <div class="brand">
        <span class="brand-logo">L</span>
        <a href="{% url 'staff_admin_dashboard' %}"><span class="brand-name">PetAdmin</span></a>
    </div>
    <div class="nav-right">
        <div class="pill-name">{{ request.user.get_full_name|default:request.user.username }}</div>
        <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>
</nav>
